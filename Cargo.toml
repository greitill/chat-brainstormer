[package]
name = "probability-amplifier-v2"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
dashmap = "6.2.1"
dotenvy = "0.15.7"
futures = "0.3.34"
hmac = "0.12.1"
# Patched local copy: fixes SubscribeMessageType deserialize for signals /
# message-actions (`"e": 1|3`) which upstream 0.8.0 mishandles.
pubnub = { path = "vendor/pubnub", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.19"
tower-http = { version = "0.6", features = ["fs", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
